openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: The Waffle Hub BCM - KOT & Billing API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: categories
  - name: products
  - name: orders
  - name: customers
  - name: expenses
  - name: reports
  - name: dashboard
  - name: users
  - name: public

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Public (no auth) ────────────────────────────────────────────────────────
  /public/menu:
    get:
      operationId: getPublicMenu
      tags: [public]
      summary: Active menu for customer ordering (public)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicMenuCategory"

  /public/stats:
    get:
      operationId: getPublicStats
      tags: [public]
      summary: Kitchen rush stats (public)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicStats"

  /public/orders:
    post:
      operationId: createPublicOrder
      tags: [public]
      summary: Customer self-order (public)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderTrackingResult"

  /public/customers/lookup:
    get:
      operationId: lookupPublicCustomer
      tags: [public]
      summary: Look up an existing customer by phone number (public)
      parameters:
        - name: phone
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Customer found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCustomerProfile"
        "404":
          description: Customer not found

  /public/orders/{orderNumber}:
    get:
      operationId: trackPublicOrder
      tags: [public]
      summary: Track order by order number (public)
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderTrackingResult"

  # ── Categories ──────────────────────────────────────────────────────────────
  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /categories/{id}:
    patch:
      operationId: updateCategory
      tags: [categories]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
    delete:
      operationId: deleteCategory
      tags: [categories]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Products ─────────────────────────────────────────────────────────────────
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List all products
      parameters:
        - name: categoryId
          in: query
          schema:
            type: integer
        - name: active
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/{id}:
    patch:
      operationId: updateProduct
      tags: [products]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [products]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Orders ───────────────────────────────────────────────────────────────────
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders with optional filters
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: date
          in: query
          schema:
            type: string
        - name: customerId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
    patch:
      operationId: updateOrder
      tags: [orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
    delete:
      operationId: deleteOrder
      tags: [orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}/items:
    post:
      operationId: addOrderItem
      tags: [orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderItem"
    put:
      operationId: replaceOrderItems
      tags: [orders]
      summary: Atomically replace all items in an active order (pending_payment, approved, or preparing)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceOrderItemsInput"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "409":
          description: Order not in editable status

  /orders/{id}/items/{itemId}:
    patch:
      operationId: updateOrderItem
      tags: [orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderItemUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderItem"
    delete:
      operationId: deleteOrderItem
      tags: [orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /orders/{id}/payment:
    get:
      operationId: getOrderPayment
      tags: [orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
    post:
      operationId: createOrderPayment
      tags: [orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
    patch:
      operationId: updateOrderPayment
      tags: [orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  # ── Customers ────────────────────────────────────────────────────────────────
  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
    post:
      operationId: createCustomer
      tags: [customers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  /customers/{id}:
    get:
      operationId: getCustomer
      tags: [customers]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
    patch:
      operationId: updateCustomer
      tags: [customers]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
    delete:
      operationId: deleteCustomer
      tags: [customers]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Expenses ─────────────────────────────────────────────────────────────────
  /expenses:
    get:
      operationId: listExpenses
      tags: [expenses]
      parameters:
        - name: period
          in: query
          schema:
            type: string
        - name: date
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Expense"
    post:
      operationId: createExpense
      tags: [expenses]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"

  /expenses/{id}:
    patch:
      operationId: updateExpense
      tags: [expenses]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
    delete:
      operationId: deleteExpense
      tags: [expenses]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Users ────────────────────────────────────────────────────────────────────
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Dashboard & Reports ───────────────────────────────────────────────────────
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Live dashboard counts and summary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /reports/daily:
    get:
      operationId: getDailyReport
      tags: [reports]
      parameters:
        - name: date
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyReport"

  /reports/products:
    get:
      operationId: getProductReport
      tags: [reports]
      parameters:
        - name: period
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductSalesItem"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ── Category ──────────────────────────────────────────────────────────────
    Category:
      type: object
      required: [id, name, displayOrder, active, createdAt]
      properties:
        id:           { type: integer }
        name:         { type: string }
        displayOrder: { type: integer }
        active:       { type: boolean }
        createdAt:    { type: string }

    CategoryInput:
      type: object
      required: [name]
      properties:
        name:         { type: string, minLength: 1 }
        displayOrder: { type: integer }
        active:       { type: boolean }

    CategoryUpdate:
      type: object
      properties:
        name:         { type: string, minLength: 1 }
        displayOrder: { type: integer }
        active:       { type: boolean }

    # ── Product ───────────────────────────────────────────────────────────────
    Product:
      type: object
      required: [id, name, price, active, createdAt]
      properties:
        id:          { type: integer }
        categoryId:  { type: ["integer", "null"] }
        categoryName: { type: ["string", "null"] }
        name:        { type: string }
        description: { type: ["string", "null"] }
        price:       { type: number }
        active:      { type: boolean }
        createdAt:   { type: string }

    ProductInput:
      type: object
      required: [name, price]
      properties:
        categoryId:  { type: ["integer", "null"] }
        name:        { type: string, minLength: 1 }
        description: { type: string }
        price:       { type: number, minimum: 0 }
        active:      { type: boolean }

    ProductUpdate:
      type: object
      properties:
        categoryId:  { type: ["integer", "null"] }
        name:        { type: string, minLength: 1 }
        description: { type: ["string", "null"] }
        price:       { type: number, minimum: 0 }
        active:      { type: boolean }

    # ── Order ─────────────────────────────────────────────────────────────────
    Order:
      type: object
      required: [id, orderNumber, customerName, orderType, status, totalAmount, createdAt, readyTime, items]
      properties:
        id:           { type: integer }
        orderNumber:  { type: string }
        customerId:   { type: ["integer", "null"] }
        customerName: { type: string }
        customerPhone: { type: ["string", "null"] }
        orderType:    { type: string }
        status:       { type: string }
        notes:        { type: ["string", "null"] }
        priority:     { type: boolean }
        totalAmount:  { type: number }
        createdAt:    { type: string }
        readyTime:    { type: string }
        updatedAt:    { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        payment:
          $ref: "#/components/schemas/Payment"

    OrderInput:
      type: object
      required: [customerName, orderType]
      properties:
        customerName:  { type: string, minLength: 1 }
        customerPhone: { type: string }
        customerId:    { type: ["integer", "null"] }
        orderType:     { type: string }
        notes:         { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemInput"

    OrderUpdate:
      type: object
      properties:
        customerName:  { type: string }
        customerPhone: { type: string }
        orderType:     { type: string }
        notes:         { type: ["string", "null"] }
        priority:      { type: boolean }

    OrderStatusUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string }

    # ── Order Item ────────────────────────────────────────────────────────────
    OrderItem:
      type: object
      required: [id, orderId, productName, price, quantity, itemOrderType]
      properties:
        id:            { type: integer }
        orderId:       { type: integer }
        productId:     { type: ["integer", "null"] }
        productName:   { type: string }
        price:         { type: number }
        quantity:      { type: integer }
        itemOrderType: { type: string }
        notes:         { type: ["string", "null"] }

    ReplaceOrderItemsInput:
      type: object
      required: [items]
      properties:
        notes:
          type: ["string", "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemInput"

    OrderItemInput:
      type: object
      required: [productName, price, quantity]
      properties:
        productId:     { type: ["integer", "null"] }
        productName:   { type: string, minLength: 1 }
        price:         { type: number }
        quantity:      { type: integer, minimum: 1 }
        itemOrderType: { type: string }
        notes:         { type: string }

    OrderItemUpdate:
      type: object
      properties:
        quantity: { type: integer, minimum: 1 }
        notes:    { type: ["string", "null"] }

    # ── Payment ───────────────────────────────────────────────────────────────
    Payment:
      type: object
      required: [id, orderId, totalAmount, cashAmount, upiAmount, cardAmount, totalPaid, status, createdAt]
      properties:
        id:          { type: integer }
        orderId:     { type: integer }
        totalAmount: { type: number }
        cashAmount:  { type: number }
        upiAmount:   { type: number }
        cardAmount:  { type: number }
        totalPaid:   { type: number }
        balance:     { type: number }
        status:      { type: string }
        createdAt:   { type: string }

    PaymentInput:
      type: object
      required: [totalAmount]
      properties:
        totalAmount: { type: number }
        cashAmount:  { type: number }
        upiAmount:   { type: number }
        cardAmount:  { type: number }

    PaymentUpdate:
      type: object
      properties:
        cashAmount: { type: number }
        upiAmount:  { type: number }
        cardAmount: { type: number }

    # ── Customer ──────────────────────────────────────────────────────────────
    Customer:
      type: object
      required: [id, name, phone, totalSpending, orderCount, createdAt]
      properties:
        id:            { type: integer }
        name:          { type: string }
        phone:         { type: string }
        totalSpending: { type: number }
        orderCount:    { type: integer }
        lastOrderDate: { type: ["string", "null"] }
        favoriteItems: { type: ["string", "null"] }
        createdAt:     { type: string }

    CustomerInput:
      type: object
      required: [name, phone]
      properties:
        name:  { type: string, minLength: 1 }
        phone: { type: string, minLength: 1 }

    CustomerUpdate:
      type: object
      properties:
        name:  { type: string }
        phone: { type: string }

    # ── Expense ───────────────────────────────────────────────────────────────
    Expense:
      type: object
      required: [id, title, amount, paymentMethod, createdAt]
      properties:
        id:            { type: integer }
        title:         { type: string }
        amount:        { type: number }
        paymentMethod: { type: string }
        notes:         { type: ["string", "null"] }
        expenseDate:   { type: string }
        createdAt:     { type: string }

    ExpenseInput:
      type: object
      required: [title, amount, paymentMethod]
      properties:
        title:         { type: string, minLength: 1 }
        amount:        { type: number, minimum: 0 }
        paymentMethod: { type: string }
        notes:         { type: string }
        expenseDate:   { type: string }

    ExpenseUpdate:
      type: object
      properties:
        title:         { type: string }
        amount:        { type: number }
        paymentMethod: { type: string }
        notes:         { type: ["string", "null"] }
        expenseDate:   { type: string }

    # ── Dashboard ─────────────────────────────────────────────────────────────
    DashboardSummary:
      type: object
      required: [pendingCount, approvedCount, preparingCount, readyCount, completedToday, cancelledToday, todayRevenue, todayOrders, todayExpenses]
      properties:
        pendingCount:    { type: integer }
        approvedCount:   { type: integer }
        preparingCount:  { type: integer }
        readyCount:      { type: integer }
        completedToday:  { type: integer }
        cancelledToday:  { type: integer }
        todayRevenue:    { type: number }
        todayOrders:     { type: integer }
        todayExpenses:   { type: number }
        recentOrders:
          type: array
          items:
            $ref: "#/components/schemas/Order"

    # ── Reports ───────────────────────────────────────────────────────────────
    DailyReport:
      type: object
      required: [date, totalOrders, totalRevenue, cashRevenue, upiRevenue, cardRevenue, totalExpenses, estimatedProfit, avgOrderValue, completedOrders, cancelledOrders]
      properties:
        date:             { type: string }
        totalOrders:      { type: integer }
        totalRevenue:     { type: number }
        cashRevenue:      { type: number }
        upiRevenue:       { type: number }
        cardRevenue:      { type: number }
        totalExpenses:    { type: number }
        estimatedProfit:  { type: number }
        avgOrderValue:    { type: number }
        completedOrders:  { type: integer }
        cancelledOrders:  { type: integer }

    ProductSalesItem:
      type: object
      required: [productName, totalQuantity, totalRevenue]
      properties:
        productName:   { type: string }
        totalQuantity: { type: integer }
        totalRevenue:  { type: number }

    # ── User ──────────────────────────────────────────────────────────────────
    User:
      type: object
      required: [id, username, role, active, createdAt]
      properties:
        id:          { type: integer }
        username:    { type: string }
        role:        { type: string }
        displayName: { type: ["string", "null"] }
        active:      { type: boolean }
        createdAt:   { type: string }

    UserInput:
      type: object
      required: [username, password, role]
      properties:
        username:    { type: string, minLength: 1 }
        password:    { type: string, minLength: 4 }
        role:        { type: string }
        displayName: { type: string }

    UserUpdate:
      type: object
      properties:
        username:    { type: string }
        password:    { type: string }
        role:        { type: string }
        displayName: { type: ["string", "null"] }
        active:      { type: boolean }

    # ── Public ────────────────────────────────────────────────────────────────
    PublicMenuProduct:
      type: object
      required: [id, name, price]
      properties:
        id:          { type: integer }
        name:        { type: string }
        description: { type: ["string", "null"] }
        price:       { type: number }

    PublicMenuCategory:
      type: object
      required: [id, name, displayOrder, products]
      properties:
        id:           { type: integer }
        name:         { type: string }
        displayOrder: { type: integer }
        products:
          type: array
          items:
            $ref: "#/components/schemas/PublicMenuProduct"

    PublicCustomerProfile:
      type: object
      required: [id, name, phone, orderCount, totalSpending]
      properties:
        id:            { type: integer }
        name:          { type: string }
        phone:         { type: string }
        orderCount:    { type: integer }
        totalSpending: { type: number }
        favoriteItems: { type: ["string", "null"] }
        lastOrderDate: { type: ["string", "null"] }
        recentOrders:
          type: array
          items:
            type: object
            required: [orderNumber, totalAmount, createdAt, itemSummary]
            properties:
              orderNumber: { type: string }
              totalAmount:  { type: number }
              createdAt:    { type: string }
              itemSummary:  { type: string }

    PublicStats:
      type: object
      required: [preparing, rushLevel]
      properties:
        preparing: { type: integer }
        rushLevel: { type: string }

    OrderTrackingResult:
      type: object
      required: [id, orderNumber, customerName, orderType, status, totalAmount, createdAt, items]
      properties:
        id:            { type: integer }
        orderNumber:   { type: string }
        customerName:  { type: string }
        customerPhone: { type: ["string", "null"] }
        orderType:     { type: string }
        status:        { type: string }
        totalAmount:   { type: number }
        notes:         { type: ["string", "null"] }
        createdAt:     { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
