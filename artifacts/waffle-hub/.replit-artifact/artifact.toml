kind = "web"
previewPath = "/"
title = "The Waffle Hub BCM"
version = "1.0.0"
id = "artifacts/waffle-hub"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18660

[services.development]
run = "pnpm --filter @workspace/waffle-hub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/waffle-hub", "run", "build" ]
publicDir = "artifacts/waffle-hub/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18660"
BASE_PATH = "/"
